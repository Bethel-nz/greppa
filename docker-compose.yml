services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: greppa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  greppa:
    build: .
    restart: unless-stopped
    ports:
      - "3009:3009"
    env_file:
      - .env
    volumes:
      - greppa-data:/data

volumes:
  greppa-data:
  postgres-data:
